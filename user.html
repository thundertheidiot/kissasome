<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link href="/front/style.css" rel="stylesheet" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Loading | kissasome</title>
	</head>

	<body>
		<header class="header">
			<a class="header-brand" href="/">kissasome</a>
			<button class="feed-action" id="auth-action" type="button" hidden>
				Log in
			</button>
			<button class="feed-action" id="log-out" type="button" hidden>
				Log out
			</button>
		</header>

		<main>
			<h1 class="heading" id="profile-name">Loading</h1>
			<div class="feed-list" id="feed" tabindex="-1" aria-busy="true">
				<div class="skeleton-card" aria-hidden="true"></div>
				<div class="skeleton-card" aria-hidden="true"></div>
				<div class="skeleton-card" aria-hidden="true"></div>
			</div>
			<p id="status" class="visually-hidden" role="status"></p>
		</main>

		<footer class="footer">
			<strong>
				Kissasome - social media for cat people
				<span aria-hidden="true">🐾</span>
			</strong>
			<a class="footer-contact" href="mailto:kissasome@meowcloud.net"
				>Contact Us</a
			>
		</footer>

		<script type="module" src="/front/user.ts"></script>
	</body>
</html>
