<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="/front/style.css" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | kissasome</title>
</head>

<body>
  <div class="feed">
    <header class="feed-header">
	  <a class="feed-brand" href="/">kissasome</a>
      <button class="feed-action" id="auth-action" type="button" hidden>
        Log in
      </button>
      <button class="feed-action" id="log-out" type="button" hidden>
        Log out
      </button>
    </header>
    <main>
      <form id="post-form" class="post-form" aria-labelledby="post-form-title" hidden>
        <h2 id="post-form-title" class="visually-hidden">New post</h2>

        <label for="post-image">Cat picture</label>
        <input id="post-image" type="file" accept="image/*" aria-describedby="post-error" required />

        <label for="post-text">Caption (optional)</label>
        <p id="post-text-hint" class="post-hint">Up to 200 characters.</p>
        <textarea id="post-text" rows="3" aria-describedby="post-text-hint post-error"></textarea>

        <p id="post-error" role="alert"></p>

        <button type="submit">Publish</button>
        <button id="post-cancel" type="button">Cancel</button>
      </form>
      <h1 class="heading">Latest posts</h1>
      <div class="feed-list" id="feed" tabindex="-1" aria-busy="true">
        <div class="skeleton-card" aria-hidden="true"></div>
        <div class="skeleton-card" aria-hidden="true"></div>
        <div class="skeleton-card" aria-hidden="true"></div>
      </div>
      <p id="status" class="visually-hidden" role="status"></p>
    </main>
  </div>

  <script type="module" src="/front/index.ts"></script>
</body>

</html>
