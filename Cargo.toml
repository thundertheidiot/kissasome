[package]
name = "kissasome"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.7.2"
actix-web = "4.18.1"
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "runtime-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
migration = { path = "migration" }
argon2 = "0.6.0"
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread"] }
actix-session = { version = "0.11.0", features = ["cookie-session"] }
base64 = "0.23.1"
actix-multipart = "0.8.8"
image = "0.25.10"
webp = "0.3.1"
uuid = { version = "1.29.2", features = ["v4"] }
